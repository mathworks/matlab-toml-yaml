name: MATLAB

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        release: [R2022b, latest]
        exclude:
          - os: macos-latest
            release: R2022b
        include:
          # macos-latest is ARM; R2022b predates Apple Silicon support (R2023b+)
          - os: macos-13
            release: R2022b

    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
          cache: true

      - name: Run MATLAB build
        uses: matlab-actions/run-build@v3
        with:
          tasks: test

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.release }}
          path: coverage/
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-reports/

      - name: Merge and summarize coverage
        run: |
          pip install pycobertura
          find coverage-reports -name 'cobertura.xml' > xml_list.txt
          cat xml_list.txt
          pycobertura merge $(cat xml_list.txt | tr '\n' ' ') -o combined-cobertura.xml
          pycobertura show combined-cobertura.xml --format markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-combined
          path: combined-cobertura.xml

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest
          cache: true

      - name: Build toolbox
        uses: matlab-actions/run-build@v3
        with:
          tasks: mltbx

      - name: Upload toolbox artifact
        uses: actions/upload-artifact@v4
        with:
          name: MATLAB_Toolbox_for_TOML_and_YAML.mltbx
          path: release/MATLAB_Toolbox_for_TOML_and_YAML.mltbx
