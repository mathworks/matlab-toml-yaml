name: MATLAB

on:
  push:
  pull_request:
  workflow_dispatch: {}

env:
  MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        release: [R2022b, latest]
        exclude:
            # macos-latest is ARM; R2022b predates Apple Silicon support (R2023b+).
          - os: macos-latest
            release: R2022b
        # Disabled: macos-13 runners are slow to provision.
        # include:
        #   - os: macos-13
        #     release: R2022b

    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
          cache: true

      - name: Run MATLAB build
        uses: matlab-actions/run-build@v3
        with:
          tasks: test

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.release }}
          path: coverage/
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-reports/

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest
          cache: true

      - name: Merge coverage reports
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath("buildUtilities");
            mergeCoverageReports("coverage-reports", "coverage-combined/summary.md");

      - name: Write summary to job page
        run: cat coverage-combined/summary.md >> "$GITHUB_STEP_SUMMARY"

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest
          cache: true

      - name: Set toolbox version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "TOOLBOX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build toolbox
        uses: matlab-actions/run-build@v3
        with:
          tasks: mltbx

      - name: Upload toolbox artifact
        uses: actions/upload-artifact@v4
        with:
          name: MATLAB_Toolbox_for_TOML_and_YAML.mltbx
          path: release/MATLAB_Toolbox_for_TOML_and_YAML.mltbx

  release:
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only release commits that have been merged to main.
      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main."
            exit 1
          fi

      - name: Download toolbox artifact
        uses: actions/download-artifact@v4
        with:
          name: MATLAB_Toolbox_for_TOML_and_YAML.mltbx

      # Create a draft; an admin reviews and publishes it (published releases are immutable).
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" MATLAB_Toolbox_for_TOML_and_YAML.mltbx \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft
          {
            echo "Draft release created for \`$GITHUB_REF_NAME\`. Verify the asset digest before publishing:"
            echo '```'
            sha256sum MATLAB_Toolbox_for_TOML_and_YAML.mltbx
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
