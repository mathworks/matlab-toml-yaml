; Simple Windows INI Configuration File
; This is an example configuration for a web application.

[application]
name=MyWebApp
version=2.1.0
environment=production
debug=false

[server]
host=0.0.0.0
port=8080
ssl=true
ssl_cert=/etc/ssl/cert.pem
ssl_key=/etc/ssl/key.pem
worker_threads=8

[database]
host=db.internal.local
port=5432
name=myapp_prod
user=appuser
connection_pool=20
connection_timeout=30
ssl=true

[cache]
enabled=true
type=redis
host=cache.internal.local
port=6379
ttl=3600

[logging]
level=INFO
format=json
output=file
file=/var/log/myapp.log
max_size=104857600
backup_count=5

[security]
auth_method=oauth2
oauth2_provider=https://auth.example.com
session_timeout=1800
csrf_protection=true
cors_enabled=true
allowed_origins=https://example.com,https://www.example.com
